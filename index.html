/* RaidHub-inspired dungeon record gallery */
.profile-dungeon-gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-top:17px}
.record-tile{min-width:0;overflow:hidden;background:#0d1018;border:1px solid #292637;border-radius:5px;box-shadow:0 9px 30px #0003;transition:border-color .18s,transform .18s}
.record-tile:hover{border-color:#596a73;transform:translateY(-2px)}
.record-tile-cover{height:170px;background:linear-gradient(130deg,var(--c1),var(--c2));background-size:cover;background-position:center;position:relative;display:flex;flex-direction:column;justify-content:end;padding:17px;isolation:isolate}
.record-tile-cover:before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#070911c9 0%,#06071312 80%);z-index:-1}
.record-tile-cover:after{content:attr(data-glyph);position:absolute;top:0;right:13px;opacity:.12;font-size:100px;font-weight:900;z-index:-1}
.record-tile-cover h3{font:800 clamp(14px,1.45vw,21px) 'Space Grotesk',sans-serif;margin:0;text-transform:uppercase;line-height:1.18;text-shadow:0 2px 8px #000b;overflow-wrap:anywhere}
.record-tile-cover small{color:#e0e7e9;font-size:10px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:7px}
.record-tile-content{padding:17px 17px 20px;min-height:215px}
.record-chart-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid #292b38;padding-bottom:17px}
.record-chart{position:relative;flex:1;height:57px;min-width:0}
.record-chart-line{position:absolute;top:29px;left:0;right:0;height:2px;background:#5b606d}
.record-dot{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #ffffff48;box-shadow:0 0 0 2px #080a12b0}
.record-dot.complete{background:#49b969}.record-dot.incomplete{background:#e84e4c}.record-dot:hover{z-index:2;box-shadow:0 0 0 3px #e9eaf144}
.record-chart-empty{position:absolute;top:36px;left:0;color:#7c8795;font-size:11px}
.record-total{text-align:right;width:52px;flex-shrink:0}.record-total strong{display:block;font:800 27px 'Space Grotesk'}.record-total span{font-size:10px;color:#8896a9;text-transform:uppercase;line-height:1.3}
.record-times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:16px;text-align:center}.record-times strong{display:block;font-size:14px;color:#e4ebf2;white-space:nowrap}.record-times span{display:block;color:#8995a5;font-size:10px;text-transform:uppercase;margin-top:7px}
.record-tile-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:12px;border-top:1px solid #262b35;font-size:10px;color:#8994a3;gap:8px}
.record-bestlink{color:#b6f77a;text-decoration:none;font-weight:800}.record-bestlink:hover{text-decoration:underline}
.record-tile-meta{display:block;color:#8595a7;font-size:10px;margin-top:7px}
.profile-section-caption{color:#99a5b5;font-size:12px;margin:5px 0 0}
.profile-best-report{color:#b6f77a!important;text-decoration:none}.profile-best-report:hover{text-decoration:underline}

<script>
const data=[
{name:'Equilibrium',year:2025,place:'Venus',seal:'Praxic',exotic:'Heirloom',c1:'#694c39',c2:'#2e2638',symbol:'✧',desc:'Between fire and shadow, the path to balance.'},
{name:'Sundered Doctrine',year:2025,place:'Savathûn’s Throne World',seal:'Delver',exotic:'Finality’s Auger',c1:'#5c473e',c2:'#1b3136',symbol:'◈',desc:'Power lies in the deepest vault.'},
{name:'Vesper’s Host',year:2024,place:'Europa orbit',seal:'Unleashed',exotic:'Ice Breaker',c1:'#315a6c',c2:'#162b40',symbol:'⌘',desc:'Defy the algorithm. Cut through its web.'},
{name:'Warlord’s Ruin',year:2023,place:'European Dead Zone',seal:'Wrathbearer',exotic:'Buried Bloodline',c1:'#5c423b',c2:'#29313f',symbol:'♜',desc:'Explore a Dark Age castle and its cursed relics.'},
{name:'Ghosts of the Deep',year:2023,place:'Titan',seal:'Ghoul',exotic:'The Navigator',c1:'#24646b',c2:'#1c3039',symbol:'≋',desc:'Drown in the deep, or rise from it.'},
{name:'Spire of the Watcher',year:2022,place:'Mars',seal:'WANTED',exotic:'Hierarchy of Needs',c1:'#7f5633',c2:'#3a2935',symbol:'△',desc:'Ascend a Seraph facility and stop the Vex.'},
{name:'Duality',year:2022,place:'Leviathan',seal:'Discerptor',exotic:'Heartshadow',c1:'#704243',c2:'#2d223d',symbol:'◉',desc:'Dive into the nightmares of an exiled emperor.'},
{name:'Grasp of Avarice',year:2021,place:'Cosmodrome',seal:'—',exotic:'Gjallarhorn',c1:'#5d5d2f',c2:'#263c34',symbol:'✦',desc:'A cautionary tale of greed and treasure.'},
{name:'Prophecy',year:2020,place:'Realm of the Nine',seal:'—',exotic:'—',c1:'#52417e',c2:'#252343',symbol:'◇',desc:'Enter the realm of the Nine to seek answers.'},
{name:'Pit of Heresy',year:2019,place:'Moon',seal:'—',exotic:'Xenophage quest',c1:'#6c3231',c2:'#2b292d',symbol:'♢',desc:'Descend beneath the Scarlet Keep.'},
{name:'The Shattered Throne',year:2018,place:'Dreaming City',seal:'—',exotic:'Wish-Ender quest',c1:'#385b72',c2:'#302747',symbol:'♛',desc:'Strike back at the curse of the Dreaming City.'}
];
const players=[['Astra#1024',582,'12:46',41,18],['Vortex#7781',549,'13:08',37,15],['Nova#3912',520,'13:33',34,13],['Cipher#4580',476,'14:02',33,12],['Echo#2088',431,'14:24',28,11],['Orion#6914',399,'15:11',26,9],['Riven#0042',368,'15:36',22,8],['Ghost#8180',335,'16:02',19,7]];
let current='overview',metric='clears',filter='all',sort='newest',chosen='Equilibrium',playerName='',profileTab='overview',dungeonFilter='all';
const BUNGIE_API_KEY='97a39a6ef7f6405bacfe85e8b99da513'; // Public browser API key; never place OAuth secrets here.
let liveProfile=null, liveLoading=false, liveError='', requestVersion=0;
const activityNames=new Map();
const activityArt=new Map();
const icon=(id)=>`<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-${id}"/></svg>`;
const format=(n)=>n.toLocaleString('en-US');
function navigate(page){if(page!=='guardian' && new URL(location.href).searchParams.has('profile')){const u=new URL(location.href);u.searchParams.delete('profile');history.pushState({},'',u.pathname+u.search+u.hash)}current=page;document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',n.dataset.page===page));document.getElementById('breadcrumb').textContent=({overview:'Overview',dungeons:'All Dungeons',leaderboards:'Leaderboards',profile:'Player Lookup',guardian:'Guardian Profile',history:'Activity History'})[page];window.scrollTo({top:0,behavior:'smooth'});render();}
function stats(){return `<div class="stats"><div class="stat"><div class="stathead">Available Dungeons <span>${icon('grid')}</span></div><div class="statnum">11</div><div class="statfooter">From 2018 — 2025</div></div><div class="stat"><div class="stathead">Fireteam Size <span>${icon('user')}</span></div><div class="statnum">1—3</div><div class="statfooter">Solo & fireteam challenges</div></div><div class="stat"><div class="stathead">Core Record Types <span>${icon('trophy')}</span></div><div class="statnum">6</div><div class="statfooter">Clears, solos, flawless & more</div></div><div class="stat"><div class="stathead">Data Connection <span>${icon('shield')}</span></div><div class="statnum" style="font-size:24px;color:#f8c98d">Demo</div><div class="statfooter">Bungie API integration pending</div></div></div>`}
function cards(limit){let list=data.filter(d=>filter==='all'||(filter==='recent'?d.year>=2024:filter==='classic'?d.year<=2021:true));if(sort==='oldest')list=[...list].sort((a,b)=>a.year-b.year);if(sort==='az')list=[...list].sort((a,b)=>a.name.localeCompare(b.name));if(limit)list=list.slice(0,limit);return `<div class="dungeons">${list.map((d)=>`<article class="dungeon" role="button" tabindex="0" onclick="openDungeon('${d.name.replace(/'/g,"\\'")}')" onkeydown="if(event.key==='Enter')this.click()"><div class="cover" style="--c1:${d.c1};--c2:${d.c2}"><span class="year">${d.year}</span><span class="symbol">${d.symbol}</span></div><div class="dungeonbody"><div class="dungeonname">${d.name}</div><div class="destination">${d.place}</div><div class="cardfoot"><div><small>Dungeon seal</small><strong>${d.seal}</strong></div><div style="align-items:end"><small>View records</small><strong class="greentext">Explore ↗</strong></div></div></div></article>`).join('')}</div>`}
function leaderboard(){const labels={clears:'Total Clears',speed:'Fastest Clear',solo:'Solo Clears',flawless:'Solo Flawless',sherpas:'Sherpas'};let sorted=[...players];if(metric==='speed')sorted.sort((a,b)=>a[2].localeCompare(b[2]));else if(metric==='solo')sorted.sort((a,b)=>b[3]-a[3]);else if(metric==='flawless')sorted.sort((a,b)=>b[4]-a[4]);else if(metric==='sherpas')sorted.sort((a,b)=>(b[1]/3|0)-(a[1]/3|0));else sorted.sort((a,b)=>b[1]-a[1]);return `<div class="tablepanel"><div class="tabs">${Object.entries(labels).map(([k,v])=>`<button class="tab ${metric===k?'active':''}" onclick="metric='${k}';render()">${v}</button>`).join('')}</div><div style="overflow-x:auto"><table><thead><tr><th>Rank</th><th>Guardian</th><th>${labels[metric]}</th><th class="hide-mobile">Featured Record</th><th class="hide-mobile">Status</th></tr></thead><tbody>${sorted.map((p,i)=>`<tr style="cursor:pointer" onclick="showProfile('${p[0]}')"><td><span class="rank ${i<3?'top':''}">${String(i+1).padStart(2,'0')}</span></td><td><span class="avatar">${p[0][0]}</span><b>${p[0]}</b></td><td><b>${metric==='speed'?p[2]:metric==='solo'?p[3]:metric==='flawless'?p[4]:metric==='sherpas'?Math.floor(p[1]/3):format(p[1])}</b></td><td class="hide-mobile">${data[(i+2)%data.length].name}</td><td class="hide-mobile"><span class="badge">Sample entry</span></td></tr>`).join('')}</tbody></table></div></div><p class="note">Demonstration leaderboard with fictional Guardian names and sample values. Rankings are not pulled from Bungie.</p>`}
function render(){let out='';if(current==='overview'){out=`<div class="hero"><div><div class="eyebrow">THE DUNGEON ENDGAME, DECODED</div><h1>Every dungeon.<br><em>Every record.</em></h1><p>Explore all Destiny 2 dungeons, compare speedruns, celebrate solo flawless clears, and uncover your Guardian’s dungeon legacy.</p><button class="primary" onclick="navigate('profile')">Search a Guardian ↗</button></div><div class="heroart"><span>✧</span></div></div>${stats()}<div class="sectionhead"><div><h2>Explore Dungeons</h2><p>All 11 dungeons in the Destiny 2 universe</p></div><button class="smalllink" onclick="navigate('dungeons')">View all dungeons →</button></div>${cards(8)}<div class="sectionhead"><div><h2>Guardian Leaderboards</h2><p>Compare records across the dungeon scene</p></div><button class="smalllink" onclick="navigate('leaderboards')">Explore rankings →</button></div>${leaderboard()}`}
else if(current==='dungeons'){out=`<div class="eyebrow">THE COMPLETE DIRECTORY</div><div class="sectionhead" style="margin-top:9px"><div><h2 style="font-size:34px">All Dungeons</h2><p>Every Destiny 2 dungeon, newest to oldest</p></div><div class="controls"><select class="select" aria-label="Filter dungeons" onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>All releases</option><option value="recent" ${filter==='recent'?'selected':''}>2024+</option><option value="classic" ${filter==='classic'?'selected':''}>2018–2021</option></select><select class="select" aria-label="Sort dungeons" onchange="sort=this.value;render()"><option value="newest" ${sort==='newest'?'selected':''}>Newest first</option><option value="oldest" ${sort==='oldest'?'selected':''}>Oldest first</option><option value="az" ${sort==='az'?'selected':''}>A to Z</option></select></div></div>${cards()}`}
else if(current==='leaderboards'){out=`<div class="eyebrow">THE COMPETITIVE EDGE</div><div class="sectionhead" style="margin-top:9px"><div><h2 style="font-size:34px">Dungeon Leaderboards</h2><p>Speedrun times, clears, solo challenges and sherpa records</p></div><select class="select" aria-label="Dungeon filter" onchange="chosen=this.value;render()">${['All Dungeons',...data.map(d=>d.name)].map(n=>`<option ${chosen===n?'selected':''}>${n}</option>`).join('')}</select></div><p class="note">Selected dungeon: ${chosen}. Dataset below is illustrative; dungeon-specific live rankings require a stats backend.</p>${leaderboard()}`}
else if(current==='profile'){out=`<div class="eyebrow">GUARDIAN INTELLIGENCE</div><h1 style="font:700 37px 'Space Grotesk';letter-spacing:-1px">Player lookup</h1><div class="searchcallout"><h2 style="font:700 22px 'Space Grotesk';margin-top:0">Find a Guardian</h2><p style="color:#9aabbd">Enter your full Bungie Name, including # and four digits, to load public dungeon activities through Bungie.</p><form onsubmit="event.preventDefault();showProfile(document.getElementById('playerInput').value)"><input id="playerInput" placeholder="GuardianName#1234" required><button class="primary">View Profile →</button></form></div>${playerName?profile(playerName):`<div class="empty">Search for a Guardian to load recent dungeon activities.</div>`}`}
else if(current==='guardian'){out=guardianPage()}
else if(current==='history'){out=`<div class="eyebrow">RUN BY RUN</div><h1 style="font:700 37px 'Space Grotesk'">Dungeon Activity History</h1><p style="color:#93a2b5">Recent Bungie API activities for the last Guardian you searched. These are not complete historical totals.</p>${liveProfile?historyTable(liveProfile.activities):`<div class="empty">Search a Guardian first on the Player Lookup page to see real dungeon activity.</div>`}`}

document.getElementById('page').innerHTML=out+`<footer class="footer"><span>© 2026 DungeonHub · Unofficial Destiny 2 fan concept · Not affiliated with Bungie</span><span><a href="https://www.bungie.net/7/en/Destiny" target="_blank" rel="noopener">Destiny 2</a> · <a href="https://bungie-net.github.io/" target="_blank" rel="noopener">Bungie API</a></span></footer>`}
function duration(seconds){if(!Number.isFinite(seconds))return '—';const s=Math.max(0,Math.floor(seconds));return `${Math.floor(s/3600)?`${Math.floor(s/3600)}:`:''}${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function historyTable(activities){if(!activities.length)return '<div class="empty">No recent dungeon activities returned. The Guardian may have a private profile or no accessible records.</div>';return `<div class="tablepanel" style="overflow-x:auto"><table><thead><tr><th>Dungeon activity</th><th>Date</th><th>Duration</th><th>Completion</th><th>Report</th></tr></thead><tbody>${activities.slice(0,100).map(a=>`<tr><td><b>${escapeHtml(a.name)}</b></td><td>${escapeHtml(new Date(a.date).toLocaleDateString())}</td><td>${duration(a.duration)}</td><td>${a.completed?'<span class="badge">Completed</span>':'Incomplete'}</td><td>${a.instanceId?`<a target="_blank" rel="noopener noreferrer" style="color:var(--accent)" href="https://www.bungie.net/en/PGCR/${encodeURIComponent(a.instanceId)}">PGCR ↗</a>`:'—'}</td></tr>`).join('')}</tbody></table></div><p class="note">Shows up to 100 most recent dungeon-mode activities retrieved from Bungie (maximum 100 per character in this initial lookup); partial history is not an all-time record. Activity names come from Bungie definitions when available. Speedrun rankings and solo-flawless verification are not implemented.</p>`}
function profile(name){const safe=escapeHtml(name);if(liveLoading)return `<div class="empty"><h2>Looking up ${safe}…</h2><p>Searching Bungie and loading recent dungeon runs for each character.</p></div>`;if(liveError)return `<div class="empty"><h2>Couldn't load ${safe}</h2><p>${escapeHtml(liveError)}</p><p>Confirm the Bungie app Origin Header is <b>https://nonoba12.github.io</b>, then try again.</p><button class="primary" onclick="showProfile(playerName)">Retry search ↻</button></div>`;if(!liveProfile)return '<div class="empty">Search with your Bungie Name (example: Guardian#1234).</div>';let a=liveProfile.activities;const completed=a.filter(x=>x.completed);const best=completed.length?duration(Math.min(...completed.map(x=>x.duration).filter(Number.isFinite))):'—';return `<div class="profilehero"><div class="profileicon">${safe.slice(0,1).toUpperCase()}</div><div><h2>${safe}</h2><p>Public Bungie activity data <span class="badge">LIVE API</span></p></div></div><div class="sectionhead"><h2>Recent Dungeon Records</h2></div><div class="detailstats"><div><small>Recent runs fetched</small><b>${a.length}</b></div><div><small>Completed (recent)</small><b>${completed.length}</b></div><div><small>Best recent completion</small><b>${best}</b></div></div><p class="note">Only the most recent 100 dungeon-mode activities per character are requested. These are NOT lifetime totals. Solo, solo-flawless and leaderboards need additional validation and historical indexing.</p><div class="sectionhead"><h2>Recent Bungie dungeon activities</h2><button class="smalllink" onclick="navigate('history')">Activity history →</button></div>${historyTable(a)}`;}

function profileURL(type,id){const u=new URL(location.href);u.searchParams.set('profile',`${type}-${id}`);return u.pathname+u.search;}
function openGuardian(type,id,name,account){
  playerName=name||playerName||'Guardian';profileTab='overview';dungeonFilter='all';
  liveProfile=null;liveError='';liveLoading=true;const version=++requestVersion;
  const newUrl=profileURL(type,id);if(location.pathname+location.search!==newUrl)history.pushState({profile:true},'',newUrl);
  current='guardian';document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
  document.getElementById('breadcrumb').textContent='Guardian Profile';window.scrollTo({top:0});render();
  loadAccount(type,id,version,account);
}
function copyProfileLink(){navigator.clipboard?.writeText(location.href).then(()=>{const el=document.getElementById('copyLinkBtn');if(el){el.textContent='✓ Copied';setTimeout(()=>{if(el)el.textContent='Copy profile link';},1700)}}).catch(()=>window.prompt('Copy profile URL:',location.href));}
function formatInt(n){return Number(n||0).toLocaleString('en-US')}
function guardianPage(){
 if(liveLoading)return `<div class="eyebrow">GUARDIAN RECORD</div><div class="profileloading"><span class="spinner"></span><h1>Loading Guardian profile</h1><p>Fetching character data and recent dungeon activities from Bungie…</p></div>`;
 if(liveError)return `<div class="eyebrow">GUARDIAN RECORD</div><div class="profileloading"><h1>Could not load this profile</h1><p>${escapeHtml(liveError)}</p><button class="primary" onclick="navigate('profile')">Search again</button></div>`;
 if(!liveProfile)return '<div class="empty">No Guardian loaded.</div>';
 const {activities:a,account,characters,displayName,memberType}=liveProfile;
 const done=a.filter(x=>x.completed);const validClears=done.filter(x=>Number.isFinite(x.duration));const bestRecentRun=validClears.length?validClears.reduce((best,run)=>run.duration<best.duration?run:best):null;const fastest=bestRecentRun?.duration??null;
 const kills=a.reduce((n,x)=>n+(x.kills||0),0),deaths=a.reduce((n,x)=>n+(x.deaths||0),0);
 const last=a.length?new Date(a[0].date).toLocaleDateString():'—';
 const initials=escapeHtml(displayName.trim().slice(0,1).toUpperCase());
 const charCards=characters.map(c=>`<div class="characterbox"><div class="characterbadge">${['TITAN','HUNTER','WARLOCK'][c.classType]||'GUARDIAN'}</div><strong>${escapeHtml(c.classLabel)}</strong><span>Power ${formatInt(c.light)}</span><small>${escapeHtml(c.raceLabel||'')} · ${escapeHtml(c.genderLabel||'')}</small></div>`).join('');
 let tabContent='';
 if(profileTab==='overview'){
  const recent=a.slice(0,8);tabContent=`<section><div class="panel-title sectionhead"><div><h2>Dungeon breakdown</h2><p class="profile-section-caption">Your latest recorded clears, dates and Bungie reports</p></div><button class="smalllink" onclick="profileTab='dungeons';render()">See all →</button></div>${dungeonRows(a,true)}</section><section class="profile-panel" style="margin-top:23px"><div class="panel-title"><h2>Characters</h2><span class="muted">${characters.length} found</span></div><div class="charactergrid">${charCards||'<p class="muted">No public characters.</p>'}</div><div class="subnote">Power and class details are supplied by Bungie.</div></section><div class="panel-title sectionhead"><h2>Latest dungeon runs</h2><button class="smalllink" onclick="profileTab='runs';render()">View all recent runs →</button></div>${historyTable(recent)}`;
 }else if(profileTab==='dungeons'){
  tabContent=`<div class="panel-title sectionhead"><div><h2>Dungeon statistics</h2><p>Completions and fastest times within fetched activity history</p></div><select class="select" onchange="dungeonFilter=this.value;render()"><option value="all" ${dungeonFilter==='all'?'selected':''}>All dungeons</option><option value="played" ${dungeonFilter==='played'?'selected':''}>Played only</option></select></div>${dungeonRows(a,false)}`;
 }else{
  tabContent=`<div class="panel-title sectionhead"><div><h2>Activity history</h2><p>${a.length} recent dungeon activities across ${characters.length} characters</p></div></div>${historyTable(a)}`;
 }
 return `<div class="profile-cover"><div class="profile-cover-art">✧</div><div class="eyebrow">DUNGEONHUB / GUARDIAN PROFILE</div><div class="profile-mainline"><div class="profilebigavatar">${initials}</div><div class="profileidentity"><h1>${escapeHtml(displayName)}</h1><div class="profilemeta"><span class="badge">● BUNGIE LIVE</span><span>${escapeHtml(memberType)}</span><span>Membership ${escapeHtml(String(account.membershipId))}</span></div></div><div class="profileactions"><button class="pill" id="copyLinkBtn" onclick="copyProfileLink()">Copy profile link</button><button class="pill" onclick="navigate('profile')">New search ↗</button></div></div></div>
 <div class="profilemetrics"><div><small>Recent dungeon runs</small><strong>${formatInt(a.length)}</strong><span>Fetched from Bungie</span></div><div><small>Recent completions</small><strong>${formatInt(done.length)}</strong><span>Within fetched runs</span></div><div><small>Fastest recent clear</small><strong>${bestRecentRun?.instanceId?`<a class="profile-best-report" href="https://www.bungie.net/en/PGCR/${encodeURIComponent(bestRecentRun.instanceId)}" target="_blank" rel="noopener noreferrer">${duration(bestRecentRun.duration)} ↗</a>`:(fastest!==null?duration(fastest):'—')}</strong><span>${bestRecentRun?escapeHtml(new Date(bestRecentRun.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})):'Across all dungeons'}</span></div><div><small>Recent dungeon kills</small><strong>${formatInt(kills)}</strong><span>${formatInt(deaths)} deaths in fetched runs</span></div><div><small>Last dungeon activity</small><strong class="smaller">${last}</strong><span>Most recent recorded run</span></div></div>
 <div class="profile-warning">ⓘ <span><b>Recent activity sample, not lifetime totals.</b> Bungie activity history is paginated, and this browser-only prototype currently retrieves up to 100 dungeon runs per character. Solo, flawless, dungeon-specific verified speedruns and all-time records require deeper indexing and PGCR verification. This is a dedicated public player page, not a privacy-restricted account.</span></div>
 <div class="profiletabs"><button class="${profileTab==='overview'?'selected':''}" onclick="profileTab='overview';render()">Overview</button><button class="${profileTab==='dungeons'?'selected':''}" onclick="profileTab='dungeons';render()">Dungeon Records</button><button class="${profileTab==='runs'?'selected':''}" onclick="profileTab='runs';render()">Activity History</button></div>${tabContent}`;
}
function dungeonRows(activities,compact){
 // A record card shows the complete recent sample of run results for its dungeon.
 const byName=new Map(data.map(d=>[d.name,{d,runs:[],clears:[],image:''}]));
 for(const a of activities){
  const match=data.find(d=>a.name?.toLowerCase().includes(d.name.toLowerCase()) || (d.name==='The Shattered Throne' && a.name?.toLowerCase().includes('shattered throne')));
  if(!match)continue;
  const r=byName.get(match.name);r.runs.push(a);
  if(a.completed && Number.isFinite(a.duration))r.clears.push(a);
  if(!r.image && a.image)r.image=a.image;
 }
 let rows=[...byName.values()];
 if(dungeonFilter==='played'&&!compact)rows=rows.filter(x=>x.runs.length>0);
 if(compact)rows=rows.filter(x=>x.runs.length>0).slice(0,8);
 if(!rows.length)return `<div class="empty">No recognized dungeon activities found in the recent Bungie activity sample.</div>`;
 const tile=r=>{
  const done=r.clears;
  const fastest=done.length?done.reduce((best,run)=>run.duration<best.duration?run:best):null;
  const latest=done[0]||null;
  const avg=done.length?done.reduce((t,x)=>t+x.duration,0)/done.length:null;
  const validDate=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
  const times=[latest?.duration,fastest?.duration,avg].map(n=>Number.isFinite(n)?duration(n):'N/A');
  const sorted=[...r.runs].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const timeline=sorted.length?sorted.slice(-20).map((run,i,all)=>{
   const pos=all.length===1?50:6+i*88/(all.length-1);
   const vertical=29+Math.sin(i*1.8)*11;
   return `<span class="record-dot ${run.completed?'complete':'incomplete'}" style="left:${pos}%;top:${vertical}px" title="${escapeHtml(validDate(run.date))} • ${escapeHtml(duration(run.duration))} • ${run.completed?'Completed':'Incomplete'}"></span>`;
  }).join(''):'<span class="record-chart-empty">No recent runs</span>';
  const image=r.image?`background-image:linear-gradient(0deg,#0a0b1466,#0a0b1415),url('${r.image}')`:'';
  const bestLink=fastest?.instanceId?`<a class="record-bestlink" href="https://www.bungie.net/en/PGCR/${encodeURIComponent(fastest.instanceId)}" target="_blank" rel="noopener noreferrer" title="Open Bungie activity report">${times[1]} ↗</a>`:`<strong>${times[1]}</strong>`;
  return `<article class="record-tile"><div class="record-tile-cover" data-glyph="${escapeHtml(r.d.symbol)}" style="--c1:${r.d.c1};--c2:${r.d.c2};${image}"><small>${r.d.year} · ${escapeHtml(r.d.place)}</small><h3>${escapeHtml(r.d.name)}</h3></div><div class="record-tile-content"><div class="record-chart-row"><div class="record-chart"><div class="record-chart-line"></div>${timeline}</div><div class="record-total"><strong>${done.length}</strong><span>Recent<br>clears</span></div></div><div class="record-times"><div><strong>${times[0]}</strong><span>Recent</span></div><div>${bestLink}<span>Fastest</span></div><div><strong>${times[2]}</strong><span>Average</span></div></div><div class="record-tile-bottom"><span>${r.runs.length} runs sampled</span><span>${latest?'Last clear: '+escapeHtml(validDate(latest.date)):'No recent clear'}</span></div>${fastest?`<small class="record-tile-meta">Best recent: ${escapeHtml(validDate(fastest.date))}${fastest.instanceId?' · Bungie PGCR available':''}</small>`:''}</div></article>`;
 };
 return `<div class="profile-dungeon-gallery">${rows.map(tile).join('')}</div><p class="subnote">Green dots = completed, red dots = incomplete. The timeline shows up to 20 of the retrieved runs per dungeon, not a complete lifetime record. Artwork is loaded from Bungie activity definitions where available.</p>`;
}
async function loadAccount(type,id,version,knownAccount){
 try{
  const result=await bungie(`/Destiny2/${type}/Profile/${id}/?components=100,200`);
  if(version!==requestVersion)return;
  const profileData=result?.profile?.data||{};
  const userInfo=profileData.userInfo||{};
  const chars=Object.entries(result?.characters?.data||{});
  if(!chars.length)throw new Error('No public Destiny 2 characters found for this Guardian.');
  const memberships={1:'Xbox',2:'PlayStation',3:'Steam',4:'Blizzard',5:'Stadia',6:'Epic Games',10:'Demon',254:'Bungie'};
  const characters=chars.map(([characterId,c])=>({characterId,classType:c.classType,classLabel:['Titan','Hunter','Warlock'][c.classType]||'Guardian',light:c.light,raceLabel:['Human','Awoken','Exo'][c.raceType]||'',genderLabel:['Male','Female'][c.genderType]||''}));
  const perChar=await Promise.all(chars.map(async ([characterId])=>{
   try{let result=await bungie(`/Destiny2/${type}/Account/${id}/Character/${characterId}/Stats/Activities/?mode=82&count=100&page=0`);return result?.activities||[]}
   catch(e){return []}
  }));
  let activities=perChar.flat().map(x=>({date:x.period,hash:x.activityDetails?.directorActivityHash||x.activityDetails?.referenceId,instanceId:x.activityDetails?.instanceId,duration:Number(x.values?.activityDurationSeconds?.basic?.value??NaN),completed:Number(x.values?.completed?.basic?.value)===1,kills:Number(x.values?.kills?.basic?.value||0),deaths:Number(x.values?.deaths?.basic?.value||0),assists:Number(x.values?.assists?.basic?.value||0),characterId:x.activityDetails?.characterId||''})).filter(x=>x.date).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const hashes=[...new Set(activities.map(x=>x.hash).filter(Boolean))];
  await Promise.all(hashes.slice(0,35).map(getActivityName));
  activities.forEach(a=>{a.name=activityNames.get(a.hash)||`Dungeon activity (${a.hash||'unknown'})`;a.image=activityArt.get(a.hash)||'';});
  const resolvedName=userInfo.bungieGlobalDisplayName?`${userInfo.bungieGlobalDisplayName}#${String(userInfo.bungieGlobalDisplayNameCode).padStart(4,'0')}`:(userInfo.displayName||playerName||'Guardian');
  if(version!==requestVersion)return;
  playerName=resolvedName;
  liveProfile={account:knownAccount||{membershipId:String(id),membershipType:Number(type)},activities,characters,displayName:resolvedName,memberType:memberships[type]||'Destiny 2'};
  liveLoading=false;liveError='';if(current==='guardian'||current==='history')render();
 }catch(e){if(version!==requestVersion)return;liveError=e.message||String(e);liveLoading=false;if(current==='guardian')render();}
}
async function bungie(path,options={}){let response;try{response=await fetch('https://www.bungie.net/Platform'+path,{...options,headers:{'X-API-Key':BUNGIE_API_KEY,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}})}catch(e){throw new Error('Network or CORS request blocked. Set the Bungie application Origin Header to https://nonoba12.github.io (no trailing slash or /Dungeonhub path).')}if(!response.ok)throw new Error(`Bungie returned HTTP ${response.status}. Check your Bungie app Origin Header and API key.`);let body=await response.json();if(body.ErrorCode!==1)throw new Error(body.Message||body.ErrorStatus||'Bungie returned an error');return body.Response;}
async function getActivityName(hash){if(!hash)return 'Unknown dungeon';if(activityNames.has(hash))return activityNames.get(hash);try{const def=await bungie(`/Destiny2/Manifest/DestinyActivityDefinition/${hash}/`);let title=def?.displayProperties?.name||def?.originalDisplayProperties?.name||`Activity ${hash}`;activityNames.set(hash,title);if(def?.pgcrImage && /^\/[a-zA-Z0-9_\/.-]+$/.test(def.pgcrImage))activityArt.set(hash,'https://www.bungie.net'+def.pgcrImage);return title;}catch(e){return `Activity ${hash}`;}}
async function loadGuardian(name,version){
 try{
  let m=name.match(/^(.+)#(\d{1,4})$/);if(!m)throw new Error('Use the full Bungie Name, such as Guardian#1234.');
  const memberships=await bungie('/Destiny2/SearchDestinyPlayerByBungieName/-1/',{method:'POST',body:JSON.stringify({displayName:m[1],displayNameCode:Number(m[2])})});
  if(version!==requestVersion)return;
  if(!memberships?.length)throw new Error('No Destiny 2 account found for that Bungie Name.');
  const account=memberships[0];openGuardian(account.membershipType,account.membershipId,name,account);
 }catch(e){if(version!==requestVersion)return;liveError=e.message||String(e);liveLoading=false;if(current==='profile')render();}
}

function showProfile(name){
 playerName=String(name||'').trim();if(!playerName)return;
 liveProfile=null;liveError='';liveLoading=true;const version=++requestVersion;
 document.getElementById('globalSearch').value='';document.getElementById('searchResults').classList.add('hidden');navigate('profile');loadGuardian(playerName,version);
}

function openDungeon(name){const d=data.find(v=>v.name===name);if(!d)return;document.getElementById('modalContent').innerHTML=`<div class="modalhero" style="--c1:${d.c1};--c2:${d.c2}"><button class="close" onclick="hideModal()" aria-label="Close">×</button><h2>${d.name}</h2></div><div class="modalbody"><div class="eyebrow">${d.year} · ${d.place}</div><p>${d.desc}</p><div class="detailstats"><div><small>Dungeon Seal</small><b>${d.seal}</b></div><div><small>Featured Exotic</small><b style="font-size:14px">${d.exotic}</b></div><div><small>Team Size</small><b>1–3</b></div></div><p style="font-size:12px">Dungeon-specific completion history, solo-flawless records and speedrun leaderboards will connect to live Bungie data in a production version.</p><button class="primary" onclick="hideModal();chosen='${d.name.replace(/'/g,"\\'")}';navigate('leaderboards')">View leaderboard →</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function hideModal(){document.getElementById('modal').classList.add('hidden')}document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});
function escapeHtml(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const search=document.getElementById('globalSearch');search.addEventListener('input',()=>{let v=search.value.trim().toLowerCase(),res=document.getElementById('searchResults');if(!v){res.classList.add('hidden');return}let matches=data.filter(d=>d.name.toLowerCase().includes(v)).slice(0,5);res.innerHTML=matches.map(d=>`<button data-dungeon="${escapeHtml(d.name)}">✧ &nbsp;${d.name}<small style="color:#71829a;float:right">Dungeon</small></button>`).join('')+`<button id="searchGuardian">${icon('user')} &nbsp;Search Guardian: ${escapeHtml(search.value)}</button>`;res.classList.remove('hidden');res.querySelectorAll('[data-dungeon]').forEach(b=>b.addEventListener('click',()=>{res.classList.add('hidden');openDungeon(b.dataset.dungeon)}));document.getElementById('searchGuardian').addEventListener('click',()=>showProfile(search.value))});search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const match=data.find(d=>d.name.toLowerCase()===search.value.toLowerCase());if(match)openDungeon(match.name);else showProfile(search.value)}});document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))document.getElementById('searchResults').classList.add('hidden')});window.addEventListener('popstate',()=>{const p=new URL(location.href).searchParams.get('profile');if(p){const match=p.match(/^(\d+)-(\d+)$/);if(match)openGuardian(match[1],match[2]);}else{current='overview';navigate('overview');}});
const requestedProfile=new URL(location.href).searchParams.get('profile');
if(requestedProfile){const match=requestedProfile.match(/^(\d+)-(\d+)$/);if(match)openGuardian(match[1],match[2]);else render();}else render();
</script></body></html>
